name: Android Chinese debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate mobile package
        run: |
          bun run type-check:mobile
          bun run lint:mobile
      - name: Build web assets and sync Android only
        run: |
          bun run mobile:build
          cd packages/mobile
          bunx cap sync android
      - name: Build debug APK without release credentials
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Version check from the exported Gradle manifest
        working-directory: packages/mobile/android
        run: |
          set -euo pipefail
          manifest="app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          if [[ ! -f "$manifest" ]]; then
            manifest="$(find app/build/intermediates -name AndroidManifest.xml -path '*debug*' -print -quit)"
          fi
          echo "manifest: $manifest"
          grep -o 'android:versionCode="[0-9]*"' "$manifest"
          grep -o 'android:versionName="[^"]*"' "$manifest"
          grep -o 'android:label="[^"]*"' "$manifest" || true
      - name: Verify the APK carries the Chinese resources
        working-directory: packages/mobile/android
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          echo "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump resources "$apk" | grep -E 'values-zh-rCN|values-zh-rTW|sealed_push_channel_name' | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: openchamber-zh-android-debug
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
