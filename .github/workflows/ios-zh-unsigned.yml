name: iOS Chinese unsigned IPA

# Manual, self-contained iOS localization build for the Chinese fork.
# It never touches the official release.yml / mobile-release.yml workflows and never
# uses the upstream Apple signing secrets. It produces an UNSIGNED IPA that the user
# must re-sign locally (Sideloadly / AltStore / own certificate) before installing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-zh-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_PACKAGE_DIR: packages/mobile
  IOS_PROJECT_DIR: packages/mobile/ios/App

jobs:
  ios-unsigned:
    name: iOS unsigned IPA (Chinese)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon verification dependency
        run: python3 -m pip install 'Pillow==12.0.0'

      - name: Report toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
          bun --version
          node --version
          # Capacitor 8 needs CocoaPods 1.16+; the runner image can lag behind.
          pod --version | awk -F. '($1 * 1000 + $2) < 1016 { exit 1 }'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared mobile web assets
        run: bun run mobile:build

      - name: Sync iOS project (Capacitor)
        run: |
          cd packages/mobile
          bunx cap sync ios

      - name: Set the fork's iOS version
        run: python3 packages/mobile/scripts/zh-set-ios-version.py

      - name: Install CocoaPods
        working-directory: packages/mobile/ios/App
        run: pod install --repo-update

      - name: Archive iOS app without code signing
        shell: bash
        working-directory: packages/mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenChamber.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            -allowProvisioningUpdates=NO

      - name: Verify the archived app carries the fork's icon
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OpenChamber.xcarchive"
          app_path="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          # The script decodes the compiled CgBI icons Xcode writes and compares
          # them to the Android baseline, so an asset-catalog icon that never made
          # it into the archive fails the build instead of the user's device.
          python3 packages/mobile/scripts/zh-verify-ipa-icon.py --app "$app_path"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OpenChamber.xcarchive"
          app_path="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No .app found in archive Products/Applications"
            ls -la "$archive/Products/Applications" || true
            exit 1
          fi
          echo "Archived app: $app_path"

          # An .ipa is just a zip with a top-level Payload/ directory holding the .app.
          export_dir="$RUNNER_TEMP/ipa"
          rm -rf "$export_dir"
          mkdir -p "$export_dir/Payload"
          cp -R "$app_path" "$export_dir/Payload/"

          (
            cd "$export_dir"
            zip -qry -y OpenChamber-unsigned.ipa Payload
          )

          ipa="$export_dir/OpenChamber-unsigned.ipa"
          if [[ ! -s "$ipa" ]]; then
            echo "IPA was not produced"
            exit 1
          fi
          ls -l "$ipa"

      - name: Inspect unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/ipa/OpenChamber-unsigned.ipa"
          echo "=== unzip listing (top levels) ==="
          unzip -l "$ipa" | head -n 40
          echo "=== embedded app Info.plist ==="
          tmp="$RUNNER_TEMP/inspect"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q "$ipa" -d "$tmp"
          app="$(find "$tmp/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist" || true
          echo "=== localization bundles ==="
          find "$app" -maxdepth 2 -name '*.lproj' -print | sort
          echo "=== asset-catalog icon inside the built app ==="
          ls -l "$app/AppIcon"*.png 2>/dev/null || true
          echo "=== nested bundles ==="
          find "$app/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null || true
          echo "=== signature check (expected: unsigned) ==="
          if codesign -dv "$app" 2>&1; then
            echo "NOTE: app appears to carry a signature"
          else
            echo "Confirmed: app is not signed (codesign found no signature)"
          fi
          echo "=== sha256 ==="
          shasum -a 256 "$ipa"

      - name: Verify the archived app carries the fork's icon
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OpenChamber.xcarchive"
          app_path="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          python3 packages/mobile/scripts/zh-verify-ipa-icon.py --app "$app_path"

      - name: Verify the packaged IPA carries the fork's version
        shell: bash
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/ipa/OpenChamber-unsigned.ipa"
          # The app is not named App.app by contract, and PlistBuddy needs a file
          # to read, so extract and read the real bundle instead of a pipe.
          tmp="$RUNNER_TEMP/version-check"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q "$ipa" -d "$tmp"
          app="$(find "$tmp/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          echo "IPA version $version build $build"
          test "$version" = "2.5.0"
          test "$build" = "250"

      - uses: actions/upload-artifact@v4
        with:
          name: openchamber-zh-ios-unsigned
          path: ${{ runner.temp }}/ipa/OpenChamber-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
